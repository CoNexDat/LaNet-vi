# LaNet-vi Configuration Template
#
# This template shows all available configuration options for LaNet-vi.
# Copy this file and modify the values to customize your visualization.
#
# Usage:
#   from lanet_vi.io.config_loader import load_config_from_yaml
#   config = load_config_from_yaml("your_config.yaml")
#   net = Network(graph, config)

# ==============================================================================
# GRAPH CONFIGURATION
# ==============================================================================
graph:
  # Whether to support repeated edges between same nodes
  multigraph: false

  # Whether edges have weights
  weighted: false

  # Whether graph is directed
  directed: false

# ==============================================================================
# DECOMPOSITION CONFIGURATION
# ==============================================================================
decomposition:
  # Type of decomposition: "kcores" or "kdenses"
  decomp_type: "kcores"

  # Centrality measure: "kdense" or "mcore"
  measure: "mcore"

  # Consider graph induced from this layer upward (0 = all layers)
  from_layer: 0

  # Number of groups in weighted graphs (-1 = use max degree)
  granularity: -1

  # Method for strength intervals in weighted graphs:
  # - "equalNodesPerInterval"  (same number of nodes per interval)
  # - "equalIntervalSize"      (equal width up to maximum_strength / largest strength)
  # - "equalLogIntervalSize"   (geometric progression)
  # - "custom"                 (boundaries read from strength_intervals_file)
  strength_intervals: "equalIntervalSize"

  # Upper limit for strength intervals (null = largest strength); only used by
  # equalIntervalSize and equalLogIntervalSize
  maximum_strength: null

  # Boundaries, one per line, for strength_intervals: "custom" (null = none)
  strength_intervals_file: null

  # Whether to omit cliques in central core
  no_cliques: false

# ==============================================================================
# VISUALIZATION CONFIGURATION
# ==============================================================================
visualization:
  # Background color: "white" or "black"
  background: "white"

  # Color scheme: "col" (color), "bw" (grayscale), "bwi" (grayscale interlaced)
  color_scheme: "col"

  # Image dimensions (pixels)
  width: 1920
  height: 1080

  # Part of the picture to render, as fractions of width and height from the top-left
  # corner (the C++ -window): [hstart, hend, vstart, vend]; [0, 1, 0, 1] is everything
  window: [0.0, 1.0, 0.0, 1.0]

  # Layout parameters
  epsilon: 0.18  # Ring thickness as a fraction of its radius
  delta: 1.3     # Shrink factor of sibling components
  gamma: 1.5     # Component diameter (scales the whole picture)

  # Font size multiplier for labels
  font_zoom: 1.0

  # ============================================================================
  # EDGE CONFIGURATION
  # ============================================================================

  # Percentage of edges to show (0.0 to 1.0)
  edges_percent: 0.25

  # Minimum number of edges to display
  min_edges: 100000

  # Edge opacity for SVG/interactive renderers (0.0 to 1.0)
  opacity: 0.2

  # Whether to use gradient edge coloring (endpoint colors)
  gradient_edges: true

  # Edge transparency (0.0 = transparent, 1.0 = opaque)
  edge_alpha: 1.0

  # Edge thickness range
  min_edge_width: 0.12
  max_edge_width: 0.45

  # ============================================================================
  # VISUAL ELEMENTS
  # ============================================================================

  # Base unit length for scaling
  unit_length: 1.0

  # Whether to draw component border circles
  draw_circles: true

  # Whether to show the shell / dense index color legend
  show_color_legend: true

  # Whether to show the degree (node size) legend, as the C++ -showDegreeScale
  # (show_size_legend is a deprecated alias of this setting)
  show_degree_scale: true

  # Maximum value for color scale normalization (null = auto)
  color_scale_max_value: null

  # ============================================================================
  # NODE LABELS
  # ============================================================================

  # Whether to show node labels
  show_node_labels: false

  # If true, label all nodes; if false, use k-core range filtering
  label_all_nodes: true

  # Minimum k-core for labeling (only used if label_all_nodes = false)
  # null = no minimum
  label_kcore_min: null

  # Maximum k-core for labeling (only used if label_all_nodes = false)
  # null = no maximum
  label_kcore_max: null

# ==============================================================================
# LAYOUT CONFIGURATION
# ==============================================================================
layout:
  # Placement of the components: "classic" (concentric rings, the C++ default) or the
  # "pow" / "log" circle packing of sibling components inside their parent
  coord_distribution: "classic"

  # Constant of the disc area law of the circle packing (pow / log only)
  alpha: 0.3

  # Exponent of the disc area law (pow / log only)
  beta: 1.0

  # Random seed for reproducible layouts
  seed: 42

  # Node radius factor of the pow / log modes (null = auto-adjusted as the C++)
  ratio_constant: null

  # Minimum component size to visualize (filters small components for performance)
  min_component_size: 50

# ==============================================================================
# COMMUNITY DETECTION (a NetworkX-based addition, not part of the C++ tool)
# ==============================================================================
community:
  # Detect communities and show them in the picture (--detect-communities)
  detect_communities: false

  # "louvain" or "greedy_modularity"
  algorithm: "louvain"

  # Modularity resolution: higher gives more, smaller communities
  resolution: 1.0

  # Color the nodes (and the edges) by community instead of by index; the index color
  # legend is then not drawn. A colors file takes precedence.
  color_by_community: true

  # Draw a translucent convex hull under each community of three or more nodes
  draw_boundaries: true

  # Draw a translucent circle around each community (works better for small ones)
  draw_circles: false

  # Opacity of the hulls and circles
  boundary_alpha: 0.2

  # Matplotlib colormap of the community colors: a qualitative one ("tab20", "tab10",
  # "Set3") is used entry by entry, a continuous one ("viridis", "hsv") is sampled evenly
  colormap: "tab20"

# ==============================================================================
# RENDERER
# ==============================================================================
# Rendering engine: "matplotlib", "networkx", or "plotly"
renderer: "matplotlib"
