name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal command or Python snippet. Attach or link a small input file if possible.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LaNet-vi version
      description: Output of `python -c "import lanet_vi; print(lanet_vi.__version__)"`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, macOS 14, installed with uv"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: shell
